<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#e0e7ff" stop-opacity="0.9" />
    </linearGradient>
  </defs>
  <!-- Background with safe zone padding -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Outer Window Frame -->
  <rect x="96" y="96" width="320" height="320" rx="40" fill="none" stroke="#ffffff" stroke-width="20" stroke-opacity="0.4" />
  
  <!-- Navigation Drawer Panel -->
  <rect x="116" y="116" width="110" height="280" rx="24" fill="url(#panel)" />
  
  <!-- Drawer Nav Item Lines -->
  <rect x="136" y="156" width="70" height="14" rx="7" fill="#4f46e5" />
  <rect x="136" y="186" width="54" height="10" rx="5" fill="#818cf8" />
  <rect x="136" y="210" width="60" height="10" rx="5" fill="#818cf8" />
  <rect x="136" y="234" width="46" height="10" rx="5" fill="#818cf8" />
  
  <!-- Main Viewport Content Placeholder lines -->
  <rect x="250" y="156" width="130" height="16" rx="8" fill="#ffffff" fill-opacity="0.8" />
  <rect x="250" y="190" width="146" height="76" rx="16" fill="#ffffff" fill-opacity="0.3" />
  <rect x="250" y="280" width="146" height="76" rx="16" fill="#ffffff" fill-opacity="0.3" />
</svg>
